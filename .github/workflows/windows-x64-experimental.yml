name: Windows x64 Experimental

on:
  push:
    branches:
      - main
      - perf/recompiler-execution-flow-1
      - perf/recompiler-native-only-1
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-2022
    env:
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
      SCCACHE_CACHE_SIZE: 1G
      SCCACHE_VERSION: v0.18.0
      SCCACHE_SHA256: 8965c74d5e8a225244f741e18ad2f3f504f48228dc1bac948fc22761a348363d
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: the build number is the commit count

      # Restore the most recent compiler cache and save a new one per commit.
      # Unchanged files (all of SDL2, most of the emulator) become cache hits.
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .sccache
          key: sccache-windows-x64-${{ github.sha }}
          restore-keys: sccache-windows-x64-

      - name: Install sccache
        shell: pwsh
        run: |
          $name = "sccache-$env:SCCACHE_VERSION-x86_64-pc-windows-msvc"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/mozilla/sccache/releases/download/$env:SCCACHE_VERSION/$name.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:SCCACHE_SHA256) { throw "sccache checksum mismatch: $hash" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP -Force
          Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP $name)

      # Ninja + MSVC instead of the Visual Studio generator: the VS generator
      # runs every CMake feature check through MSBuild (slow configure) and
      # schedules compilation per project rather than per file.
      - name: Configure
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -S . -B build-windows -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ^
            -DVIBESTATION_ENABLE_X64_JIT=ON ^
            -DVIBESTATION_ENABLE_DISCORD_RPC=OFF ^
            -DVIBESTATION_ENABLE_IPO=OFF

      - name: Build Release
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          sccache --zero-stats
          cmake --build build-windows --parallel %NUMBER_OF_PROCESSORS%
          set "BUILD_RC=%errorlevel%"
          sccache --show-stats
          sccache --stop-server
          exit /b %BUILD_RC%

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build-windows/VibeStation.exe artifact/VibeStation.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: VibeStation-windows-x64-recompiler-experimental
          path: artifact/VibeStation.exe
          if-no-files-found: error
          retention-days: 7
