name: PS2 Lab Headless

on:
  push:
    branches:
      - ps2-lab
      - ps2-lab-perf-experiment
    paths:
      - "experimental/ps2/**"
      - ".github/workflows/ps2-lab.yml"
  pull_request:
    paths:
      - "experimental/ps2/**"
      - ".github/workflows/ps2-lab.yml"

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S experimental/ps2 -B build-ps2-headless -DCMAKE_BUILD_TYPE=Release -DVIBESTATION_PS2_ENABLE_UI=OFF
      - name: Build
        run: cmake --build build-ps2-headless --parallel 2
      - name: Test
        run: ctest --test-dir build-ps2-headless --output-on-failure
      - name: Upload trace runner
        uses: actions/upload-artifact@v4
        with:
          name: ps2-bios-trace-linux
          path: build-ps2-headless/vibestation_ps2_bios_trace
          if-no-files-found: error


  windows-ui:
    # Perf iteration is headless-only. Build the Windows UI once a candidate
    # is ready to hand off by tagging that commit message with [windows-ui].
    if: >-
      (github.ref == 'refs/heads/ps2-lab-perf-experiment' ||
       github.ref == 'refs/heads/perf/ps2-ee-scheduler-native-1') &&
      contains(github.event.head_commit.message, '[windows-ui]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release UI
        run: cmake -S experimental/ps2 -B build-ps2
      - name: Build Release UI
        run: cmake --build build-ps2 --config Release --target VibeStationPS2Lab --parallel 2
      - name: Upload Windows PS2 Lab
        uses: actions/upload-artifact@v4
        with:
          name: VibeStationPS2Lab-windows-perf-experiment
          path: build-ps2/Release/VibeStationPS2Lab.exe
          if-no-files-found: error
